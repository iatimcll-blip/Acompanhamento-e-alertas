<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCLL Monitoramento — Acesso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #09090b;
      --surface: #0f0f13;
      --card:    #15151c;
      --card2:   #1c1c25;
      --border:  #222230;
      --border2: #2e2e3e;
      --text:    #e2e2ec;
      --subtext: #8080a0;
      --muted:   #505065;
      --verde:   #22c55e;
      --azul:    #3b82f6;
      --vermelho:#ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* fundo com grade sutil */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 18px;
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04) inset;
      position: relative;
      z-index: 1;
    }

    /* ── Logo MCLL ── */
    .mcll-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      margin-bottom: 32px;
    }
    .mcll-letters {
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: .18em;
      background: linear-gradient(135deg, #e2e2ec 0%, #8080a0 60%, #e2e2ec 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      line-height: 1;
    }
    .mcll-sub-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mcll-chevron-l, .mcll-chevron-r {
      width: 0; height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }
    .mcll-chevron-l { border-right: 8px solid var(--azul); }
    .mcll-chevron-r { border-left:  8px solid var(--azul); }
    .mcll-sub-text {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .22em;
      color: var(--azul);
      text-transform: uppercase;
    }
    .mcll-tagline {
      font-size: .66rem;
      color: var(--muted);
      letter-spacing: .06em;
      margin-top: 6px;
    }
    .instance-badge {
      display: none;
      margin: -18px auto 22px;
      width: fit-content;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(59,130,246,.35);
      background: rgba(59,130,246,.14);
      color: #bfdbfe;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h2 {
      font-size: .92rem;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: .72rem;
      color: var(--subtext);
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-size: .88rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus {
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
    }
    input::placeholder { color: var(--muted); }

    .btn-login {
      width: 100%;
      background: var(--azul);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background .2s, transform .1s;
      letter-spacing: .04em;
    }
    .btn-login:hover  { background: #2563eb; }
    .btn-login:active { transform: scale(.98); }
    .btn-login:disabled { background: var(--muted); cursor: not-allowed; }

    .erro-msg {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5;
      border-radius: 7px;
      padding: 9px 13px;
      font-size: .78rem;
      margin-top: 14px;
      display: none;
    }
    .erro-msg.visivel { display: block; }

    .login-footer {
      text-align: center;
      margin-top: 22px;
      font-size: .66rem;
      color: var(--muted);
    }

    /* perfis badge */
    .perfis-info {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      justify-content: center;
    }
    .perfil-badge {
      font-size: .62rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
    }
    .perfil-badge.admin  { background: rgba(59,130,246,.18); color: #93c5fd; border: 1px solid rgba(59,130,246,.3); }
    .perfil-badge.user   { background: rgba(34,197,94,.13);  color: #86efac; border: 1px solid rgba(34,197,94,.25); }
  </style>
</head>
<body>

<div class="login-card">
  <!-- Logo MCLL -->
  <div class="mcll-logo">
    <div class="mcll-letters">MCLL</div>
    <div class="mcll-sub-row">
      <div class="mcll-chevron-l"></div>
      <div class="mcll-sub-text">Monitoramento</div>
      <div class="mcll-chevron-r"></div>
    </div>
    <div class="mcll-tagline">Painel de Acionamentos — Acesso Restrito</div>
  </div>
  <div class="instance-badge" id="instanceBadge"></div>

  <h2>Entrar na plataforma</h2>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required />
    </div>
    <div class="form-group">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
  </form>

  <div class="erro-msg" id="erroMsg"></div>

  <div class="login-footer">
    <div class="perfis-info">
      <span class="perfil-badge admin">Administrador</span>
      <span class="perfil-badge user">Usuário</span>
    </div>
    <div style="margin-top:10px">MCLL Monitoramento © 2025</div>
  </div>
</div>

<script>
  function aplicarNomeInstancia(nome) {
    const instanceName = (nome || '').trim();
    if (!instanceName) return;
    const badge = document.getElementById('instanceBadge');
    if (badge) {
      badge.textContent = instanceName;
      badge.style.display = 'block';
    }
    document.title = `MCLL Monitoramento — ${instanceName}`;
  }

  fetch('/api/config')
    .then(r => r.ok ? r.json() : null)
    .then(cfg => aplicarNomeInstancia(cfg && cfg.instanceName))
    .catch(() => {});

  // Se já tem token válido, redireciona direto
  const token = localStorage.getItem('mcll_token');
  if (token) {
    fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
      .then(r => r.ok ? location.replace('/painel') : null)
      .catch(() => {});
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn   = document.getElementById('btnLogin');
    const erro  = document.getElementById('erroMsg');
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;

    btn.disabled = true;
    btn.textContent = 'Verificando…';
    erro.classList.remove('visivel');

    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.erro || 'Erro ao entrar');

      localStorage.setItem('mcll_token', data.token);
      localStorage.setItem('mcll_nome',  data.nome);
      localStorage.setItem('mcll_perfil', data.perfil);
      location.replace('/painel');
    } catch (err) {
      erro.textContent = err.message;
      erro.classList.add('visivel');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
